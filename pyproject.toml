[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-seceval"
version = "0.1.0"
description = "Structured defensive security and screenshot evaluation for Qwen"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7,<3", "pyyaml>=6,<7", "Pillow>=10.1"]

[project.optional-dependencies]
test = ["pytest>=8"]
train = ["torch>=2.4", "transformers>=4.57,<5", "trl==0.29.1", "peft>=0.17,<0.19", "bitsandbytes>=0.45", "accelerate>=1.4", "datasets>=3.4,<5"]

[project.scripts]
qwen-seceval = "qwen_seceval.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
